size = 3
delay = 250

# edge_workspace.sh switches workspace, then warps the pointer to the
# opposite edge so continued movement keeps crossing desktops.
[[boundaries]]
boundary = "left"
command = "$HOME/.config/sway/scripts/edge_workspace.sh left"

[[boundaries]]
boundary = "right"
command = "$HOME/.config/sway/scripts/edge_workspace.sh right"
