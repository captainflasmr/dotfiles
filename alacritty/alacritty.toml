general.import = ["~/.config/alacritty/theme.toml"]

[font]
size = 9.0

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

[window]
opacity = 0.8

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Emacs-style scrofflling: Alt+j / Alt+k scroll the terminal scrollback
# when the alternate screen is NOT active (i.e. at the shell prompt).
# j = scroll toward newer output (Emacs scroll-up, like vim/less j),
# k = scroll back into history (Emacs scroll-down, like vim/less k).
# `mode = "~Alt"` leaves the keys untouched inside full-screen TUIs
# (opencode, less, vim), where they are handled by the application.
[[keyboard.bindings]]
key = "J"
mods = "Alt"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "K"
mods = "Alt"
mode = "~Alt"
action = "ScrollPageUp"
